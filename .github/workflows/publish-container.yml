name: Build and publish container image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality:
    name: Validate documentation and Playground
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      # 文档同步上游时一起更新此提交；避免 main 的变化影响同一份文档的检查结果。
      SNAPSHOT_DOCS_REF: 84df2fb203d1c7ecbc891d1acad33d3b573dfed1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout Snapshot documentation baseline
        uses: actions/checkout@v7
        with:
          repository: muedsa/snapshot
          ref: ${{ env.SNAPSHOT_DOCS_REF }}
          path: .ci/snapshot
          persist-credentials: false
          sparse-checkout: |
            core/src/main/kotlin
            parser/src/main/kotlin

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 Dockerfile 中的构建版本保持一致。
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@muedsa'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          # setup-node 将认证配置写入 NPM_CONFIG_USERCONFIG 指向的临时文件。
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test documentation checker
        run: pnpm docs:test

      - name: Check documentation parameter coverage
        run: pnpm docs:coverage .ci/snapshot

      - name: Test Playground
        run: pnpm playground:test

      - name: Build documentation site
        run: pnpm build

      - name: Check built documentation links
        run: pnpm docs:links

  build:
    name: Build container image
    needs: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          # LSP 包的 Package settings → Manage Actions access 需授予当前仓库 Read 权限。
          # 使用自动提供的 GITHUB_TOKEN，Dependabot PR 无需额外配置自定义令牌。
          secrets: |
            npm_token=${{ secrets.GITHUB_TOKEN }}

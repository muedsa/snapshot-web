server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Astro/Starlight 生成的是多页面静态站点。不存在的路径应返回 404，
    # 不能像 SPA 一样统一回退到首页。
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Astro 资源文件名包含内容哈希，可以长期缓存。
    location /_astro/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    # Pagefind 目录包含搜索运行时与索引，发布新文档后会发生变化。
    location /pagefind/ {
        try_files $uri =404;
        expires 1h;
        access_log off;
    }

    location /showcase/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
